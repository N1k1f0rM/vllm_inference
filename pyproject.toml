[project]
name = "vllm-test"
version = "0.1.0"
description = "Model Inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
    "vllm>=0.33.0",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
