services:
  vllm:
    image: vllm/vllm-openai:v0.11.0
    runtime: nvidia
    expose:
      - "8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - Qwen/Qwen2.5-1.5B-Instruct
      - --gpu-memory-utilization
      - "0.7"
    networks: [vllm-net]

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    expose:
      - "8081"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT}
      - VLLM_URL=http://vllm:8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 15s
    depends_on:
      vllm:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [vllm-net]
    volumes:
      - ./app:/app/app

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdb:/var/lib/postgresql/data
    networks: [vllm-net]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.6.0
    expose: 
      - "5050"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_LISTEN_PORT=${PGADMIN_LISTEN_PORT}
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vllm-net]
  
  streamlit:
    build:
      dockerfile: ./Dockerfile
      context: ./frontend
    expose:
      - "8051"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/frontend
    networks: [vllm-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8051))"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      streamlit:
        condition: service_healthy
    networks: [vllm-net]

volumes:
  huggingface-cache:
  pgdb:
  pgadmin:

networks:
  vllm-net:
    driver: bridge
