services:
  vllm:
    image: vllm/vllm-openai:v0.11.0
    runtime: nvidia
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - facebook/opt-125m
      - --gpu-memory-utilization
      - "0.7"
volumes:
  huggingface-cache:
