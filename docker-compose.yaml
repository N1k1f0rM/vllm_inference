services:
  vllm:
    image: vllm/vllm-openai:v0.11.0
    runtime: nvidia
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - facebook/opt-125m
      - --gpu-memory-utilization
      - "0.7"
    networks: [vllm-net]

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - vllm
    networks: [vllm-net]

volumes:
  huggingface-cache:

networks:
  vllm-net:
    driver: bridge
